name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag (for example, v0.1.0)
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate manual release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Manual publishing must run from main." >&2
            exit 1
          fi
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "The tag must be a stable version such as v0.1.0." >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == false' | grep -qx true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify package version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          PYTHONPATH: src
        run: |
          python3 - <<'PYCODE'
          import os
          import re
          import subprocess
          import tomllib

          from shiplord import __version__

          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          if os.environ["RELEASE_TAG"] != "v" + version:
              raise SystemExit("Release tag does not match the package version")
          if version != __version__:
              raise SystemExit("Package version does not match the CLI and helper version")

          # These historical tags predate the composite action and can still be published manually.
          if version not in {"0.1.0", "0.2.0"}:
              from shiplord.workflow import PYPI_DEPLOY_ACTION_REF

              if not re.fullmatch(r"[0-9a-f]{40}", PYPI_DEPLOY_ACTION_REF):
                  raise SystemExit("The PyPI deploy action must be pinned to a full commit SHA")
              subprocess.run(["git", "cat-file", "-e", "HEAD:deploy/action.yml"], check=True)
              result = subprocess.run(
                  ["git", "diff", "--quiet", PYPI_DEPLOY_ACTION_REF, "HEAD", "--", "deploy/"],
                  check=False,
              )
              if result.returncode != 0:
                  raise SystemExit("The PyPI deploy action pin must match the release's deploy directory")
          PYCODE
      - name: Build and check the distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
