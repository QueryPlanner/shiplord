name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  ssh-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install OpenSSH server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server
      - run: python -m pip install -e .
      - name: Test real SSH host trust and authentication
        env:
          SHIPLORD_TEST_SSHD: '1'
        run: python -m unittest discover -s tests -p test_ssh_integration.py -v

  sudo-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Test restricted sudo and app binding
        env:
          SHIPLORD_TEST_SUDO: '1'
        run: python -m unittest discover -s tests -p test_sudo_integration.py -v

  caddy-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install Caddy from the official apt repository
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debian-keyring debian-archive-keyring apt-transport-https curl gnupg
          curl -fsSL https://dl.cloudsmith.io/public/caddy/stable/gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -fsSL https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt | sudo tee /etc/apt/sources.list.d/caddy-stable.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq caddy
          sudo systemctl stop caddy || true
          caddy version
      - run: python -m pip install -e .
      - name: Test route transactions against real Caddy
        env:
          SHIPLORD_TEST_CADDY: '1'
        run: python -m unittest discover -s tests -p test_caddy_integration.py -v

  host-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install Caddy and OpenSSH server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debian-keyring debian-archive-keyring apt-transport-https curl gnupg openssh-server
          curl -fsSL https://dl.cloudsmith.io/public/caddy/stable/gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -fsSL https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt | sudo tee /etc/apt/sources.list.d/caddy-stable.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq caddy
          sudo systemctl stop caddy || true
      - run: python -m pip install -e .
      - name: Test bootstrap, provisioning, and the SSH forced-command path on a disposable VM
        run: sudo -E env "PATH=$PATH" SHIPLORD_TEST_HOST=1 python -m unittest tests.test_host_integration -v

  docker-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Test the deploy engine against real Docker and a local registry
        env:
          SHIPLORD_TEST_DOCKER: '1'
        run: python -m unittest tests.test_deploy_integration -v

  linux-e2e:
    name: end-to-end (real sshd, sudo, Caddy, Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: tests/linux/run.sh e2e

  linux-systemd:
    name: native lifecycle (real systemd)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: tests/linux/run.sh systemd
