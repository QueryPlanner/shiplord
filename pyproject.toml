[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shiplord"
version = "0.1.0"
description = "Deployment tooling for applications on a server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1"]

[project.scripts]
shiplord = "shiplord.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
